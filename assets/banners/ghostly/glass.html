<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;font-family:Inter,-apple-system,sans-serif}
.b{width:1280px;height:640px;position:relative;display:flex;align-items:center;background:#0B0D16}
.ico{width:168px;height:168px;border-radius:38px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.eyebrow{color:#A8C7FF;font-size:19px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.h1{color:#F4F6FF;font-size:76px;font-weight:800;line-height:1.02;letter-spacing:-.025em}
.sub{color:#9AA3B8;font-size:26px;font-weight:400;line-height:1.5;margin-top:22px;max-width:680px}
.pills{display:flex;gap:12px;margin-top:34px}
.pill{color:#C9D6F5;font-size:17px;font-weight:500;padding:9px 18px;border-radius:999px;background:rgba(168,199,255,.1);border:1px solid rgba(168,199,255,.22)}
</style></head><body>
<div class="b" style="background:radial-gradient(1000px 800px at 85% 50%, rgba(60,80,150,.3), transparent 60%), #0A0C14">
  <div style="padding:0 80px;flex:1">
    <div class="eyebrow">Vendor-agnostic AI assistant for calls</div>
    <div class="h1">Answers while<br>you’re talking</div>
    <div class="sub">On-device speech recognition and AI answers in a floating chat beside your call.</div>
  </div>
  <div style="width:430px;height:640px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:40px">
    <img src="chat-en.png" alt="GhostlyAssistant chat" style="height:572px;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 1px rgba(168,199,255,.14)">
  </div>
</div></body></html>
