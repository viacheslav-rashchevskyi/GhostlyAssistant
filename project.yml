name: GhostlyAssistant
options:
  bundleIdPrefix: local.ghostlyassistant
  deploymentTarget:
    macOS: "26.0"
packages:
  AssistantCore:
    path: Packages/AssistantCore
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
targets:
  GhostlyAssistant:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: AssistantCore
      - package: ArgmaxOSS
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ghostlyassistant.app
        PRODUCT_NAME: GhostlyAssistant
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/GhostlyAssistant.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 3Q7L57P544
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
